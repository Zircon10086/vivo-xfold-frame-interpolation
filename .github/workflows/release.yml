name: build-module

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装检测逻辑自测
        run: bash scripts/test-customize.sh

      - name: 打包模块
        run: bash scripts/build-module.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: dist/*.zip

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
