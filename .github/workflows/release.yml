name: build-module

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装检测逻辑自测
        run: bash scripts/test-customize.sh

      # tag 推送 -> 校验并发布 immutable release；PR / 手动触发 -> 只做 dry-run 校验
      - name: 校验并发布模块
        uses: KernelSU-Modules/tools/actions/module-release@424471eacf6c0bd00e8e3708980f6b1882b5bf33
        with:
          module-dir: module
          release-notes-file: CHANGELOG.md
          dry-run: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'false' || 'true' }}
